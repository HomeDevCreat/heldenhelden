<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zomerhelden</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c1c;--red:#e8203a;--yel:#ffd21f;--blue:#1e6bff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow-x:clip}
body{background:radial-gradient(#ffffff14 1.5px,transparent 1.6px) 0 0/22px 22px,var(--bg);color:#fff;font-family:system-ui,sans-serif;text-align:center;overflow-x:clip}
.h{font-family:Bangers,Impact,sans-serif;letter-spacing:.04em;font-weight:400}
#v{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px}
.title{font-size:clamp(2.5rem,9vw,6rem);color:var(--yel);text-shadow:4px 4px 0 var(--red);margin:0}
.big{font-size:clamp(1.5rem,5vw,2.6rem);margin:0}
.num{font-size:clamp(8rem,38vw,26rem);line-height:1;color:var(--yel);text-shadow:6px 6px 0 var(--red)}
.num.pulse{animation:p .5s infinite;color:#fff;text-shadow:6px 6px 0 var(--red),0 0 60px var(--red)}
@keyframes p{50%{transform:scale(1.15) rotate(-1.5deg)}}
.card{background:#ffffff12;border:3px solid var(--yel);border-radius:14px;padding:18px;max-width:600px;width:100%;display:flex;flex-direction:column;gap:12px}
.card.w{max-width:780px;text-align:left}
select,input,textarea,button{font:inherit;font-size:1.1rem;padding:12px;border-radius:10px;border:2px solid #fff4;background:#161a33;color:#fff;max-width:100%}
button{background:var(--red);border:0;font-family:Bangers,Impact,sans-serif;letter-spacing:.05em;cursor:pointer;font-size:1.4rem}
button.b,.opt{background:var(--blue)}
.opt{display:block;width:100%;margin-top:8px;text-align:left}
/* sfeer: stralen + hartslag */
body.ray::before{content:"";position:fixed;inset:-60%;background:repeating-conic-gradient(#ffd21f1c 0 8deg,transparent 8deg 16deg);animation:spin 30s linear infinite;z-index:-1;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
body.hot::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 40px #e8203acc;animation:beat .5s infinite}
@keyframes beat{50%{opacity:.2}}
.flash{animation:f .9s}@keyframes f{0%{background:#fff;color:#fff}100%{background:transparent}}
/* onthulling */
.rv{width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px;align-items:center;padding:30vh 24px 20vh}
.st{width:100%;animation:pop .6s both;transition:opacity .8s}.st.old{opacity:.25}
.dest{font-size:clamp(2.5rem,11vw,6rem);color:var(--yel);text-shadow:4px 4px 0 var(--red);line-height:1}
.dest.sm{font-size:clamp(2rem,9vw,4.5rem)}
.nm{font-size:clamp(3rem,15vw,9.5rem);line-height:1.05;color:#fff;text-shadow:0 0 18px var(--yel),5px 5px 0 var(--red);animation:glow .8s 4 alternate}
.nm b{font-weight:400;display:inline-block;animation:slam .55s both}
@keyframes slam{0%{transform:translateY(-45vh) scale(2.2);opacity:0}70%{transform:none;opacity:1}85%{transform:scale(.92)}100%{transform:none;opacity:1}}
@keyframes glow{to{text-shadow:0 0 40px var(--yel),0 0 90px var(--red),5px 5px 0 var(--red)}}
.shake{animation:shk .08s 8}@keyframes shk{25%{transform:translate(6px,-4px)}75%{transform:translate(-6px,4px)}}
.fl{position:fixed;inset:0;background:#fff;z-index:6;pointer-events:none;animation:fo .7s both}@keyframes fo{to{opacity:0}}
@keyframes pop{0%{transform:scale(.2) rotate(-8deg);opacity:0;filter:blur(12px)}70%{transform:scale(1.15)}100%{transform:none;filter:none}}
.dots{letter-spacing:.4em;font-size:2rem;animation:blink .8s infinite}@keyframes blink{50%{opacity:.15}}
.mem{display:flex;gap:12px;align-items:center;background:#ffffff14;border-left:8px solid var(--red);border-radius:10px;padding:12px 16px;text-align:left;font-size:1.5rem;animation:sl .5s both}
.mem:nth-child(even){animation-name:sr}
@keyframes sl{from{transform:translateX(-40px);opacity:0}}@keyframes sr{from{transform:translateX(40px);opacity:0}}
.mem .lab{font-family:Bangers,Impact,sans-serif;color:var(--yel);min-width:84px;letter-spacing:.05em}
.mem.me{border-color:var(--yel);background:#ffd21f33;box-shadow:0 0 24px #ffd21f88}
.mem .no{opacity:.5;font-style:italic;font-size:1.1rem}
.chip{border:2px dashed #fff6;border-radius:999px;padding:6px 16px;font-size:1.2rem;animation:pop .5s both}
#cf{position:fixed;inset:0;pointer-events:none;z-index:5}
.qrbox{background:#fff;padding:16px;border-radius:12px;display:inline-block;line-height:0}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.dim{opacity:.55}
.dd b{display:inline-block;font-weight:400;animation:dd 1s infinite}.dd b:nth-child(2){animation-delay:.15s}.dd b:nth-child(3){animation-delay:.3s}

.lg.lgs{max-height:32px}
.eyes{font-size:5rem;animation:look 1.2s ease-in-out infinite}@keyframes look{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
.slide{display:flex;flex-direction:column;align-items:center;gap:3vh;width:100%;animation:sin .7s both}.slide.out{animation:sout .5s both}
@keyframes sin{from{opacity:0;transform:scale(.92)}}@keyframes sout{to{opacity:0;transform:scale(1.05)}}
.late{opacity:0;animation:fu .8s both;animation-delay:var(--d,0s)}@keyframes fu{from{opacity:0;transform:translateY(24px)}to{opacity:1}}
.sts{display:flex;gap:8vw;flex-wrap:wrap;justify-content:center}
.sx{display:flex;flex-direction:column;align-items:center;animation:pop .8s both}.sx:nth-child(2){animation-delay:.5s}
.sxi{font-size:clamp(3rem,9vw,7rem);animation:bob .8s ease-in-out infinite alternate}
.sxn{font-size:clamp(5rem,16vw,14rem);line-height:1;color:var(--yel);text-shadow:5px 5px 0 var(--red)}
.sxl{font-size:clamp(1.6rem,4vw,3.4rem)}
.bars{width:min(90vw,1000px);display:flex;flex-direction:column;gap:2vh}
.br{display:flex;align-items:center;gap:14px;opacity:0;animation:fu .6s both;animation-delay:var(--d)}
.bfl{font-size:clamp(1.6rem,4vw,3rem)}.bnm{width:clamp(110px,22vw,260px);text-align:left;font-size:clamp(1.3rem,3.4vw,2.6rem)}
.bt{flex:1;height:clamp(18px,4vh,40px);background:#ffffff18;border-radius:99px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--red),var(--yel));width:0;animation:gr 1.2s ease-out both;animation-delay:var(--d)}
@keyframes gr{to{width:var(--w)}}
.br b{font-size:clamp(1.6rem,4vw,3rem);min-width:2ch;color:var(--yel);font-weight:400}
.arc{height:36vh;max-width:92vw;overflow:visible}
.arc path{fill:none;stroke:var(--yel);stroke-width:4;stroke-dasharray:10 12;animation:mv 1s linear infinite}@keyframes mv{to{stroke-dashoffset:-22}}
.tl{display:grid;grid-template-columns:1fr minmax(150px,.7fr) 1fr;gap:2vw;align-items:center;width:min(96vw,1200px)}
.tlc{background:#ffffff14;border:3px solid var(--yel);border-radius:16px;padding:1.5vh 1.2vw;min-width:0}.tlc .sxi{font-size:clamp(2rem,5vw,4rem)}.tlc .sxl{font-size:clamp(1.1rem,2.4vw,2rem)}
.tld{font-size:clamp(1.6rem,3.6vw,3rem);color:var(--yel)}.tlv{font-size:clamp(.9rem,1.6vw,1.3rem)}
.tlm{display:flex;flex-direction:column;align-items:center;gap:1vh;min-width:0}
.tlb{width:100%;height:10px;background:#ffffff22;border-radius:9px;overflow:hidden}.tlb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--yel));animation:gr3 3s ease-in-out .6s both}@keyframes gr3{to{width:100%}}

.ch.nt{background:#1e6bff}
.f select{flex:1;min-width:0;padding:6px 8px;font-size:.95rem}
.pie{display:flex;align-items:center;justify-content:center;gap:5vw;flex-wrap:wrap}
.pie svg{height:44vh;max-width:90vw;overflow:visible}
.pie circle{fill:none;stroke-width:30;transform-origin:50% 50%;animation:seg .9s ease-out both;animation-delay:var(--d)}
@keyframes seg{from{stroke-dasharray:0 201}}
.leg{display:flex;flex-direction:column;gap:1.4vh;text-align:left}
.lg2{display:flex;align-items:center;gap:12px;font-size:clamp(1.2rem,2.6vw,2.2rem);opacity:0;animation:fu .6s both;animation-delay:var(--d)}
.lg2 i{width:1.1em;height:1.1em;border-radius:50%;display:inline-block}
.lg2 b{color:var(--yel);font-weight:400;margin-left:auto;padding-left:1.5em}
.f input[type=date]{flex:1;min-width:0;padding:6px 8px;font-size:.95rem;color-scheme:dark}
.fin{display:flex;flex-direction:column;align-items:center;gap:10px}
.ic{width:46px;height:46px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.ic svg{width:22px;height:22px}
.cap{margin:0;font-size:.85rem;opacity:.75;max-width:260px}
button:disabled{opacity:.4;cursor:not-allowed}
.lg{max-height:70px;max-width:60vw;object-fit:contain}.lg.lgb{max-height:150px}
/* host-editor */
.vac{border-color:var(--blue)}
.vac .row input{flex:1;min-width:140px}
.rr{display:flex;gap:8px;align-items:center}
.rr input{flex:1;min-width:0}
.rr .lab{min-width:64px;font-family:Bangers,Impact,sans-serif;color:var(--yel);font-size:1.3rem}
.x{background:#333;padding:8px 12px;font-size:1rem}
.sm{font-size:1.1rem;padding:8px 14px}
.st.nmw{animation:none}
.trem{display:inline-block;animation:trem .07s infinite}
@keyframes trem{0%,50%,100%{transform:scale(var(--sc,1))}25%{transform:translate(var(--a,1px),calc(var(--a,1px)*-.6)) rotate(.4deg) scale(var(--sc,1))}75%{transform:translate(calc(var(--a,1px)*-1),calc(var(--a,1px)*.6)) rotate(-.4deg) scale(var(--sc,1))}}
.vc{background:#ffffff0d;border:2px solid #fff3;border-radius:10px;text-align:left;width:100%}
.vh{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:8px 12px;cursor:pointer}
.vh .tt{flex:1 1 220px;font-weight:600}.vh small{font-weight:400;opacity:.7}
.ch{font-size:.78rem;padding:2px 9px;border-radius:99px}.ch.ok{background:#1a7f3c}.ch.no{background:#b4570a}
.vb{padding:8px 12px 12px;border-top:1px solid #fff2;display:flex;flex-direction:column;gap:8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.f{display:flex;align-items:center;gap:6px;font-size:.85rem}
.f>span{min-width:62px;color:var(--yel);font-family:Bangers,Impact,sans-serif;font-size:1.05rem;white-space:nowrap}
.f input[type=text],.f input:not([type]){flex:1;min-width:0;padding:6px 8px;font-size:.95rem}
.f .x{padding:4px 9px;font-size:.9rem}
#srch{width:100%}
.fly{position:fixed;top:30vh;left:-75vw;width:min(70vw,460px);z-index:7;pointer-events:none;animation:fly 1.9s linear forwards;filter:drop-shadow(0 0 18px #ffd21f)}
.fly svg,.fly img{width:100%;height:auto;display:block;animation:bob .7s ease-in-out infinite alternate}
.fly.c{animation-name:flyc}
.fly.rl{left:auto;right:-75vw;animation-name:flyl}.fly.rl .fi{transform:scaleX(-1)}
.sl.r{left:auto;right:-60vw;background:linear-gradient(270deg,transparent,#fff);animation-name:fly2l}
@keyframes fly2l{to{transform:translateX(-220vw)}}
#v{position:relative;z-index:1}
.rs{position:fixed;left:50%;top:50%;width:var(--l,20vmax);height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,currentColor);transform-origin:0 50%;z-index:0;pointer-events:none;opacity:0;animation:out .8s ease-in forwards}
@keyframes out{0%{transform:rotate(var(--g)) translateX(10vmax);opacity:0}25%{opacity:.8}100%{transform:rotate(var(--g)) translateX(75vmax);opacity:0}}
.carry{animation:carry .8s cubic-bezier(.5,0,1,1) forwards}@keyframes carry{to{transform:translateX(150vw) rotate(10deg)}}@keyframes bob{to{transform:translateY(-5px)}}
.sl{position:fixed;left:-60vw;height:5px;border-radius:3px;background:linear-gradient(90deg,transparent,#fff);z-index:6;pointer-events:none;animation:fly2 1.3s ease-in forwards}
@keyframes fly2{to{transform:translateX(220vw)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>

  const [mf, mt] = cnt(v.moni), [bf, bt] = cnt(v.bc);

    (v.age ? `<span class="ch nt">${agL(v.age)}</span>` : ch('Leeftijd', false)) + ch('VV', !!v.vv.trim()) + (v.hasCo ? ch('Co', !!v.co.trim()) : '') + (mt ? ch(`Moni ${mf}/${mt}`, mf === mt) : '') + (bt ? ch(`BC ${bf}/${bt}`, bf === bt) : '');
}
const people = v => [v.vv, v.hasCo ? v.co : '', ...v.moni, ...v.bc].filter(s => s.trim());
const full = v => norm([v.naam, v.b, v.d, v.land, v.age, ...people(v)].join(' '));

const LANDEN = ['België', 'Nederland', 'Frankrijk', 'Duitsland', 'Luxemburg', 'Spanje', 'Italië', 'Oostenrijk', 'Zwitserland', 'Tsjechië', 'Polen', 'Denemarken', 'Verenigd Koninkrijk', 'Kroatië', 'Slovenië', 'Portugal', 'Noorwegen', 'Zweden', 'Hongarije', 'Griekenland', 'Ierland', 'Slowakije'];
function statPanel() {
  const P = $('#sp'); if (!P) return;
  const sel = k => `<select data-sk="${k}"><option value="">— kies een vakantie —</option>${vacs.map((v, i) => `<option value="${i}"${v[k] ? ' selected' : ''}>${esc(v.naam || '(naamloos)')} · ${esc(v.b || '?')}</option>`).join('')}</select>`;
  const f = vacs.find(v => v.far), a = vacs.find(v => v.first), z = vacs.find(v => v.last);
  P.innerHTML = `<div class="big h">📊 Statistieken-intro</div><div class="dim">Kies zelf welke vakantie het verst gaat, als eerste vertrekt en als laatste thuiskomt.</div>
    <div class="g"><label class="f"><span>Verst</span>${sel('far')}</label><label class="f"><span>Afstand</span><input type="text" id="sk" placeholder="km (optioneel)" value="${esc(f ? f.km : '')}"${f ? '' : ' disabled'}></label></div>
    <div class="g"><label class="f"><span>Eerste</span>${sel('first')}</label><label class="f"><span>Vertrek</span><input type="date" id="sa" value="${esc(a ? a.van : '')}"${a ? '' : ' disabled'}></label></div>
    <div class="g"><label class="f"><span>Laatste</span>${sel('last')}</label><label class="f"><span>Terug</span><input type="date" id="sz" value="${esc(z ? z.tot : '')}"${z ? '' : ' disabled'}></label></div>`;
}
function ed() {
  const Q = norm(q.trim()); let shown = 0;
  $('#ed').innerHTML = vacs.map((v, i) => {
    const hide = Q && !full(v).includes(Q); if (!hide) shown++;
    return `<div class="vc"${hide ? ' style="display:none"' : ''}><div class="vh" id="h${i}" data-act="tg" data-i="${i}">${hdr(v)}</div>${v._o ? `<div class="vb">
      <div class="g">${F(i, 'naam', 'Vakantie', v.naam)}${F(i, 'b', 'Bestemming', v.b)}${F(i, 'd', 'Datum', v.d)}</div>
      <div class="g">${F(i, 'land', 'Land', v.land)}${Fs(i, 'age', 'Leeftijd', v.age)}${Fd(i, 'van', 'Vertrek', v.van)}${Fd(i, 'tot', 'Terug', v.tot)}</div>
      <div class="g">${F(i, 'vv', 'VV', v.vv)}<div class="f"><span><input type="checkbox" data-act="co" data-i="${i}" ${v.hasCo ? 'checked' : ''}> Co-VV</span>${v.hasCo ? `<input type="text" data-i="${i}" data-k="co" value="${esc(v.co)}" placeholder="nog niet gevonden" style="flex:1;min-width:0;padding:6px 8px;font-size:.95rem">` : '<i class="dim">geen co-vv</i>'}</div></div>
      <div class="g">${v.moni.map((n, j) => F(i, 'moni', 'Moni', n, j, true)).join('')}</div>
      <div class="g">${v.bc.map((n, j) => F(i, 'bc', 'BC', n, j, true)).join('')}</div>
      <div class="row" style="justify-content:flex-start"><button class="b sm" data-act="add" data-i="${i}" data-k="moni">+ moni</button><button class="b sm" data-act="add" data-i="${i}" data-k="bc">+ bc'er</button><button class="x" data-act="rm" data-i="${i}">🗑 vakantie verwijderen</button></div>
    </div>` : ''}</div>`;
  }).join('') || '<div class="dim">Nog geen vakanties. Klik op “Vakantie” of importeer een Excel.</div>';
  const tot = vacs.reduce((a, v) => a + people(v).length, 0);
  $('#cnt').textContent = `${vacs.length} vakanties · ${tot} namen · ${vacs.filter(v => !v.vv.trim()).length} zonder VV · ${vacs.filter(v => !v.land.trim()).length} zonder land · ${vacs.filter(v => !v.age).length} zonder leeftijd · ${vacs.filter(v => !v.van || !v.tot).length} zonder datums` + (Q ? ` · ${shown} gevonden` : '');
  statPanel();
}

function build() {
  const vak = {}, namen = {}, seen = {}; let dup = null;
  vacs.forEach(v => {
    const m = v.moni.map(s => s.trim()), b = v.bc.map(s => s.trim());
    vak[v.id] = {naam: v.naam.trim(), b: v.b.trim(), d: v.van && v.tot ? rng(v.van, v.tot) : v.d.trim(), land: v.land.trim(), cc: v.cc || CC[norm(v.land)] || '', age: v.age || '', far: !!v.far, first: !!v.first, last: !!v.last, km: String(v.km || '').trim(), van: v.van || '', tot: v.tot || '', vv: v.vv.trim(), hasCo: !!v.hasCo, co: v.hasCo ? v.co.trim() : '', moni: m, bc: b};
    people(v).map(s => s.trim()).forEach(n => { const k = slug(n) || 'x' + n.length; if (seen[k]) dup = n; seen[k] = 1; namen[k] = n; });
  });
  return {vak, namen, dup};
}
async function save() {
  clearTimeout(saveT);
  const {vak, namen, dup} = build();
  if (dup) return st(`⚠️ “${dup}” staat dubbel. Voeg een achternaam toe. NIET opgeslagen.`);
  st('⏳ Opslaan…');
  try { await db.ref().update({vakanties: vak, namen}); dirty = false; st('✅ Opgeslagen om ' + new Date().toLocaleTimeString('nl-BE')); }
  catch (e) { st('❌ Niet opgeslagen: ' + e.message); }
}
const queue = () => { dirty = true; st('✏️ Wijzigingen worden opgeslagen…'); clearTimeout(saveT); saveT = setTimeout(save, 800); };
window.addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });

// Excel: kolommen Vakantie, Bestemming, Datum, VV, Co-VV, Aantal moni, Moni 1.., Aantal bc, BC 1..
async function importXlsx(file) {
  try { await lazy(SHEETJS, 'XLSX'); } catch (e) { return alert('Excel-bibliotheek kon niet laden. Controleer je internet.'); }
  const wb = XLSX.read(await file.arrayBuffer(), {type: 'array', cellDates: true});
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, defval: '', raw: true});
  const hd = (rows[0] || []).map(h => norm(String(h)).trim());
  const one = f => hd.findIndex(f), many = f => hd.map((h, i) => f(h) ? i : -1).filter(i => i >= 0);
  const C = {naam: one(h => h === 'vakantie' || h === 'naam' || h === 'naam vakantie'), b: one(h => h.startsWith('bestemming')), d: one(h => h.startsWith('datum')),
    land: one(h => h === 'land'), age: one(h => h.startsWith('leeftijd')), van: one(h => h.startsWith('vertrek') || h === 'van'), tot: one(h => h.startsWith('terug') || h === 'tot'),
    vv: one(h => h === 'vv'), co: one(h => /^co[\s-]?vv$/.test(h)),
    nm: one(h => h.startsWith('aantal') && h.includes('moni')), nb: one(h => h.startsWith('aantal') && h.includes('bc')),
    m: many(h => /^moni\s*\d*$/.test(h)), bc: many(h => /^bc/.test(h) && !h.startsWith('aantal'))};
  if (C.naam < 0) return alert('Kolom “Vakantie” niet gevonden in de eerste rij. Gebruik het voorbeeldbestand als sjabloon.');
  const list = [];
  rows.slice(1).forEach(r => {
    const g = i => i >= 0 ? String(r[i] ?? '').trim() : '';
    if (!g(C.naam) && !g(C.b)) return;
    const slots = (idx, n) => { const a = idx.map(g).filter(Boolean); while (a.length < (parseInt(g(n)) || 0)) a.push(''); return a; };
    const co = g(C.co), noCo = C.co < 0 || ['nee', 'geen', '-', 'x'].includes(co.toLowerCase());
    list.push({...nv(), naam: g(C.naam), b: g(C.b), d: g(C.d), land: g(C.land), cc: CC[norm(g(C.land))] || '', age: ag(r[C.age]), van: pd(r[C.van]), tot: pd(r[C.tot]), vv: g(C.vv), hasCo: !noCo, co: noCo ? '' : co, moni: slots(C.m, C.nm), bc: slots(C.bc, C.nb)});
  });
  if (!list.length) return alert('Geen vakanties gevonden in het bestand.');
  if (!confirm(`${list.length} vakanties gevonden.\n\nOK = toevoegen aan de bestaande lijst.\nAnnuleren = niets doen.`)) return;
  vacs.push(...list); ed(); save();
}

function calcStats() {
  const L = {}; vacs.forEach(v => { const l = v.land.trim(); if (!l) return; const k = norm(l); L[k] = L[k] || {l, cc: v.cc || CC[k] || '', n: 0}; L[k].n++; });
  const lands = Object.values(L).sort((x, y) => y.n - x.n || x.l.localeCompare(y.l)).map(x => [x.l, x.cc, x.n]);
  const ages = AGES.map(a => [a, vacs.filter(v => v.age === a).length]).filter(x => x[1]);
  const T = {vac: vacs.length, vol: vacs.reduce((a, v) => a + people(v).length, 0), lands, ages}, sl = [{t: 'ov', ms: 7000}], warn = [];
  if (ages.length) sl.push({t: 'age', ms: 4000 + 500 * ages.length}); else warn.push('Geen enkele vakantie heeft een leeftijd: de taartgrafiek wordt overgeslagen.');
  if (lands.length) sl.push({t: 'co', ms: 5000 + 700 * Math.min(8, lands.length)}); else warn.push('Geen enkele vakantie heeft een land: de landenslide wordt overgeslagen.');
  const far = vacs.find(v => v.far), first = vacs.find(v => v.first), last = vacs.find(v => v.last);
  if (far) { T.far = {naam: far.naam, b: far.b, land: far.land, cc: far.cc || CC[norm(far.land)] || '', km: Math.round(parseFloat(String(far.km).replace(',', '.')) || 0)}; sl.push({t: 'far', ms: 8500}); } else warn.push('Geen "verste vakantie" gekozen: die slide wordt overgeslagen.');
  if (first && last && first.van && last.tot) { T.first = {naam: first.naam, b: first.b, dt: first.van}; T.last = {naam: last.naam, b: last.b, dt: last.tot}; sl.push({t: 'tl', ms: 9000}); }
  else warn.push('Voor de tijdlijn ontbreekt een eerste vertrek of laatste thuiskomst (of de datum ervan): die slide wordt overgeslagen.');
  return {stats: JSON.parse(JSON.stringify(T)), slides: sl, warn};
}
function start(at) {   // at = vast tijdstip van de onthulling (optioneel)
  const sec = +$('#sec').value || 60, n = Math.round(now());
  let o = {qr: true};
  if ($('#intro').checked && vacs.length) {
    const {stats, slides, warn} = calcStats();
    if (warn.length && !confirm('Let op:\n' + warn.join('\n') + '\n\nToch starten?')) return;
    const ms = slides.reduce((a, x) => a + x.ms, 0), rev = at || n + ms + sec * 1000;
    o = {qr: true, stats, slides, introMs: ms, introAt: rev - sec * 1000 - ms, revealAt: rev};
  } else o.revealAt = at || n + sec * 1000;
  db.ref('state').set(o);
}
function host(u) {
  if (!u) {
    V.innerHTML = `<h1 class="title h">HOST</h1><div class="card"><input id="em" type="email" placeholder="e-mail"><input id="pw" type="password" placeholder="wachtwoord"><button id="go">Inloggen</button></div>`;
    $('#go').onclick = () => auth.signInWithEmailAndPassword($('#em').value, $('#pw').value).catch(() => alert('Inloggen mislukt'));
    return;
  }
  V.style.justifyContent = 'flex-start';
  V.innerHTML = `<h1 class="title h" style="font-size:3rem">HOST</h1>
  <div class="card"><div class="big h">Status: <span id="st"></span></div></div>
  <div class="card"><div class="big h">Bediening</div>
    <div class="row"><button class="b" id="b0">🔦 Scherm donker</button><button class="b" id="b1">📱 Toon QR</button></div>
    <label class="row" style="gap:8px"><input type="checkbox" id="intro" style="width:auto"> 📊 Statistieken tonen vóór de countdown</label>
    <div class="row"><input id="sec" type="number" value="60" min="5" style="width:90px"> seconden countdown <button id="b2">🚀 START</button></div>
    <div class="row"><input id="at" type="datetime-local"><button class="b" id="b3">⏰ Plan op uur</button></div>
    <p class="dim" style="margin:0">Reset = “Scherm donker”. Handig om te testen.</p></div>
  <div class="card w" id="sp"></div>
  <div class="card w"><div class="big h">Vakanties</div>
    <div class="row" style="justify-content:flex-start"><button id="add">➕ Vakantie</button><button class="b sm" id="imp">📥 Excel importeren</button><button class="b sm" id="tgl">⇕ Alles open/dicht</button><button class="b sm" id="now">💾 Opslaan</button><button class="b sm" id="pd">📄 PDF</button><button class="x" id="clr">🗑 Alles wissen</button></div>
    <input id="srch" type="search" placeholder="🔍 Zoek op vakantie, bestemming of naam…">
    <div id="cnt" class="dim"></div><div id="sv" class="dim">Laden…</div></div>
  <div id="ed" style="width:100%;max-width:780px;display:flex;flex-direction:column;gap:8px"></div>
  <input type="file" id="xl" accept=".xlsx,.xls,.csv" hidden><datalist id="lands">${LANDEN.map(l => `<option value="${l}">`).join('')}</datalist>`;
  const set = o => db.ref('state').set(o);
  $('#b0').onclick = () => set({qr: false});
  $('#b1').onclick = () => set({qr: true});
  $('#intro').checked = ls.get('intro') !== '0'; $('#intro').onchange = e => ls.set('intro', e.target.checked ? '1' : '0');
  $('#b2').onclick = () => start();
  $('#b3').onclick = () => { const t = Date.parse($('#at').value); if (!t) return alert('Kies eerst een tijdstip'); start(t + off); };
  const E = $('#ed');
  $('#add').onclick = () => { const v = nv(); v._o = true; vacs.push(v); q = ''; $('#srch').value = ''; ed(); queue(); E.lastElementChild.scrollIntoView({block: 'center'}); E.lastElementChild.querySelector('input[type=text]').focus(); };
  $('#imp').onclick = () => $('#xl').click();
  $('#xl').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importXlsx(f); };
  $('#tgl').onclick = () => { const o = vacs.some(v => !v._o); vacs.forEach(v => v._o = o); ed(); };
  $('#clr').onclick = () => { if (vacs.length && confirm('ALLE vakanties wissen?') && confirm('Zeker? Dit kan je niet ongedaan maken.')) { vacs = []; ed(); save(); } };
  $('#now').onclick = save;
  $('#sp').onchange = e => {
    const t = e.target, one = k => vacs.find(v => v[k]);
    if (t.dataset.sk) { vacs.forEach(v => v[t.dataset.sk] = false); if (t.value !== '') vacs[t.value][t.dataset.sk] = true; statPanel(); queue(); }
    else if (t.id === 'sk' && one('far')) { one('far').km = t.value; queue(); }
    else if (t.id === 'sa' && one('first')) { one('first').van = t.value; ed(); queue(); }
    else if (t.id === 'sz' && one('last')) { one('last').tot = t.value; ed(); queue(); }
  };
  $('#pd').onclick = async () => { await pdf(build().vak); };
  $('#srch').oninput = e => { q = e.target.value; ed(); };
  E.oninput = e => {
    const {i, k, j} = e.target.dataset; if (i == null || !k) return;
    j != null ? vacs[i][k][j] = e.target.value : vacs[i][k] = e.target.value;
    $('#h' + i).innerHTML = hdr(vacs[i]); if (['naam', 'b', 'van', 'tot'].includes(k)) statPanel(); queue();
  };
  E.onclick = e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const {act, i, k, j} = a.dataset;
    if (act === 'tg') { vacs[i]._o = !vacs[i]._o; ed(); return; }
    if (act === 'add') vacs[i][k].push('');
    else if (act === 'del') vacs[i][k].splice(j, 1);
    else if (act === 'co') vacs[i].hasCo = a.checked;
    else if (act === 'rm') { if (!confirm('Deze vakantie verwijderen?')) return; vacs.splice(i, 1); }
    ed(); queue();
    if (act === 'add') { const l = E.querySelectorAll(`[data-i="${i}"][data-k="${k}"]`); l[l.length - 1]?.focus(); }
  };
  db.ref('vakanties').get().then(s => {
    vacs = Object.entries(s.val() || {}).map(([id, v]) => ({id, naam: v.naam || '', b: v.b || '', d: v.d || '', land: v.land || '', cc: v.cc || '', age: v.age || '', far: !!v.far, first: !!v.first, last: !!v.last, km: v.km || '', van: v.van || '', tot: v.tot || '', vv: v.vv || '', hasCo: !!v.hasCo, co: v.co || '', moni: arr(v.moni), bc: arr(v.bc), _o: false}));
    ed(); st('✅ Geladen'); cur = ''; tick();
  }).catch(e => st('❌ ' + e.message));
}
if (mode === 'host') auth.onAuthStateChanged(host);
</script></body></html>
