<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zomerhelden</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c1c;--red:#e8203a;--yel:#ffd21f;--blue:#1e6bff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow-x:clip}
body{background:radial-gradient(#ffffff14 1.5px,transparent 1.6px) 0 0/22px 22px,var(--bg);color:#fff;font-family:system-ui,sans-serif;text-align:center;overflow-x:clip}
.h{font-family:Bangers,Impact,sans-serif;letter-spacing:.04em;font-weight:400}
#v{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px}
.title{font-size:clamp(2.5rem,9vw,6rem);color:var(--yel);text-shadow:4px 4px 0 var(--red);margin:0}
.big{font-size:clamp(1.5rem,5vw,2.6rem);margin:0}
.num{font-size:clamp(8rem,38vw,26rem);line-height:1;color:var(--yel);text-shadow:6px 6px 0 var(--red)}
.num.pulse{animation:p .5s infinite;color:#fff;text-shadow:6px 6px 0 var(--red),0 0 60px var(--red)}
@keyframes p{50%{transform:scale(1.15) rotate(-1.5deg)}}
.card{background:#ffffff12;border:3px solid var(--yel);border-radius:14px;padding:18px;max-width:600px;width:100%;display:flex;flex-direction:column;gap:12px}
.card.w{max-width:780px;text-align:left}
select,input,textarea,button{font:inherit;font-size:1.1rem;padding:12px;border-radius:10px;border:2px solid #fff4;background:#161a33;color:#fff;max-width:100%}
button{background:var(--red);border:0;font-family:Bangers,Impact,sans-serif;letter-spacing:.05em;cursor:pointer;font-size:1.4rem}
button.b,.opt{background:var(--blue)}
.opt{display:block;width:100%;margin-top:8px;text-align:left}
/* sfeer: stralen + hartslag */
body.ray::before{content:"";position:fixed;inset:-60%;background:repeating-conic-gradient(#ffd21f1c 0 8deg,transparent 8deg 16deg);animation:spin 30s linear infinite;z-index:-1;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
body.hot::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 40px #e8203acc;animation:beat .5s infinite}
@keyframes beat{50%{opacity:.2}}
.flash{animation:f .9s}@keyframes f{0%{background:#fff;color:#fff}100%{background:transparent}}
/* onthulling */
.rv{width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px;align-items:center;padding:30vh 24px 20vh}
.st{width:100%;animation:pop .6s both;transition:opacity .8s}.st.old{opacity:.25}
.dest{font-size:clamp(2.5rem,11vw,6rem);color:var(--yel);text-shadow:4px 4px 0 var(--red);line-height:1}
.dest.sm{font-size:clamp(2rem,9vw,4.5rem)}
.nm{font-size:clamp(3rem,15vw,9.5rem);line-height:1.05;color:#fff;text-shadow:0 0 18px var(--yel),5px 5px 0 var(--red);animation:glow .8s 4 alternate}
.nm b{font-weight:400;display:inline-block;animation:slam .55s both}
@keyframes slam{0%{transform:translateY(-45vh) scale(2.2);opacity:0}70%{transform:none;opacity:1}85%{transform:scale(.92)}100%{transform:none;opacity:1}}
@keyframes glow{to{text-shadow:0 0 40px var(--yel),0 0 90px var(--red),5px 5px 0 var(--red)}}
.shake{animation:shk .08s 8}@keyframes shk{25%{transform:translate(6px,-4px)}75%{transform:translate(-6px,4px)}}
.fl{position:fixed;inset:0;background:#fff;z-index:6;pointer-events:none;animation:fo .7s both}@keyframes fo{to{opacity:0}}
@keyframes pop{0%{transform:scale(.2) rotate(-8deg);opacity:0;filter:blur(12px)}70%{transform:scale(1.15)}100%{transform:none;filter:none}}
.dots{letter-spacing:.4em;font-size:2rem;animation:blink .8s infinite}@keyframes blink{50%{opacity:.15}}
.mem{display:flex;gap:12px;align-items:center;background:#ffffff14;border-left:8px solid var(--red);border-radius:10px;padding:12px 16px;text-align:left;font-size:1.5rem;animation:sl .5s both}
.mem:nth-child(even){animation-name:sr}
@keyframes sl{from{transform:translateX(-40px);opacity:0}}@keyframes sr{from{transform:translateX(40px);opacity:0}}
.mem .lab{font-family:Bangers,Impact,sans-serif;color:var(--yel);min-width:84px;letter-spacing:.05em}
.mem.me{border-color:var(--yel);background:#ffd21f33;box-shadow:0 0 24px #ffd21f88}
.mem .no{opacity:.5;font-style:italic;font-size:1.1rem}
.chip{border:2px dashed #fff6;border-radius:999px;padding:6px 16px;font-size:1.2rem;animation:pop .5s both}
#cf{position:fixed;inset:0;pointer-events:none;z-index:5}
.qrbox{background:#fff;padding:16px;border-radius:12px;display:inline-block;line-height:0}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.dim{opacity:.55}
.dd b{display:inline-block;font-weight:400;animation:dd 1s infinite}.dd b:nth-child(2){animation-delay:.15s}.dd b:nth-child(3){animation-delay:.3s}
@keyframes dd{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-.15em)}}
.lg.lgs{max-height:50px}
.fin{display:flex;flex-direction:column;align-items:center;gap:10px}
.ic{width:46px;height:46px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.ic svg{width:22px;height:22px}
.cap{margin:0;font-size:.85rem;opacity:.75;max-width:260px}
button:disabled{opacity:.4;cursor:not-allowed}
.lg{max-height:70px;max-width:60vw;object-fit:contain}.lg.lgb{max-height:150px}
/* host-editor */
.vac{border-color:var(--blue)}
.vac .row input{flex:1;min-width:140px}
.rr{display:flex;gap:8px;align-items:center}
.rr input{flex:1;min-width:0}
.rr .lab{min-width:64px;font-family:Bangers,Impact,sans-serif;color:var(--yel);font-size:1.3rem}
.x{background:#333;padding:8px 12px;font-size:1rem}
.sm{font-size:1.1rem;padding:8px 14px}
.st.nmw{animation:none}
.trem{display:inline-block;animation:trem .07s infinite}
@keyframes trem{0%,50%,100%{transform:scale(var(--sc,1))}25%{transform:translate(var(--a,1px),calc(var(--a,1px)*-.6)) rotate(.4deg) scale(var(--sc,1))}75%{transform:translate(calc(var(--a,1px)*-1),calc(var(--a,1px)*.6)) rotate(-.4deg) scale(var(--sc,1))}}
.vc{background:#ffffff0d;border:2px solid #fff3;border-radius:10px;text-align:left;width:100%}
.vh{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:8px 12px;cursor:pointer}
.vh .tt{flex:1 1 220px;font-weight:600}.vh small{font-weight:400;opacity:.7}
.ch{font-size:.78rem;padding:2px 9px;border-radius:99px}.ch.ok{background:#1a7f3c}.ch.no{background:#b4570a}
.vb{padding:8px 12px 12px;border-top:1px solid #fff2;display:flex;flex-direction:column;gap:8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.f{display:flex;align-items:center;gap:6px;font-size:.85rem}
.f>span{min-width:62px;color:var(--yel);font-family:Bangers,Impact,sans-serif;font-size:1.05rem;white-space:nowrap}
.f input[type=text],.f input:not([type]){flex:1;min-width:0;padding:6px 8px;font-size:.95rem}
.f select{flex:1;min-width:0;padding:6px 8px;font-size:.95rem}
.f .x{padding:4px 9px;font-size:.9rem}
#srch{width:100%}
.fly{position:fixed;top:30vh;left:-75vw;width:min(70vw,460px);z-index:7;pointer-events:none;animation:fly 1.9s linear forwards;filter:drop-shadow(0 0 18px #ffd21f)}
.fly svg,.fly img{width:100%;height:auto;display:block;animation:bob .7s ease-in-out infinite alternate}
.fly.c{animation-name:flyc}
.fly.rl{left:auto;right:-75vw;animation-name:flyl}.fly.rl .fi{transform:scaleX(-1)}
.sl.r{left:auto;right:-60vw;background:linear-gradient(270deg,transparent,#fff);animation-name:fly2l}
@keyframes fly2l{to{transform:translateX(-220vw)}}
#v{position:relative;z-index:1}
.rs{position:fixed;left:50%;top:50%;width:var(--l,20vmax);height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,currentColor);transform-origin:0 50%;z-index:0;pointer-events:none;opacity:0;animation:out .8s ease-in forwards}
@keyframes out{0%{transform:rotate(var(--g)) translateX(10vmax);opacity:0}25%{opacity:.8}100%{transform:rotate(var(--g)) translateX(75vmax);opacity:0}}
.carry{animation:carry .8s cubic-bezier(.5,0,1,1) forwards}@keyframes carry{to{transform:translateX(150vw) rotate(10deg)}}@keyframes bob{to{transform:translateY(-5px)}}
.sl{position:fixed;left:-60vw;height:5px;border-radius:3px;background:linear-gradient(90deg,transparent,#fff);z-index:6;pointer-events:none;animation:fly2 1.3s ease-in forwards}
@keyframes fly2{to{transform:translateX(220vw)}}
.eyes{font-size:5rem;animation:eyes 1s ease-in-out infinite alternate}
@keyframes eyes{from{transform:translateX(-14px)}to{transform:translateX(14px)}}

/* ================= PRESENTATIE (alleen grote scherm) ================= */
.pres{position:fixed;inset:0;overflow:hidden;text-align:center;color:#fff}
.pv{z-index:50;background:radial-gradient(#ffffff14 1.5px,transparent 1.6px) 0 0/22px 22px,var(--bg)}
.pvx{position:fixed;top:10px;right:10px;z-index:60;font-size:1rem}
.fogbg{position:absolute;inset:0;overflow:hidden;pointer-events:none;transition:opacity 3s}
.pres.clear .fogbg{opacity:.3}
.fogbg i{position:absolute;left:var(--x);top:var(--y);width:90vmax;height:60vmax;margin:-30vmax 0 0 -45vmax;border-radius:50%;background:radial-gradient(closest-side,#b8c6ff66,#8fa3e033 55%,transparent);filter:blur(30px);animation:drift var(--d) ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-12vw,3vh) scale(1)}to{transform:translate(14vw,-4vh) scale(1.2)}}
#pst{position:absolute;inset:0}
.p-head{position:absolute;top:0;left:0;right:0;padding:2vmin 3vw;z-index:3;font-size:clamp(1.3rem,4.4vmin,3.4rem);line-height:1.1;color:var(--yel);text-shadow:3px 3px 0 var(--red);opacity:0;transform:translateY(-130%);font-family:Bangers,Impact,sans-serif;letter-spacing:.04em}
.p-head small{display:block;font-size:.58em;color:#dfe8ff;text-shadow:2px 2px 0 #1e2a6b;letter-spacing:.14em}
.p-head.on{opacity:1;transform:none;transition:transform .8s cubic-bezier(.2,1.4,.4,1),opacity .4s}
.sc{position:absolute;inset:0;z-index:1;padding:14vmin 4vw 4vmin;display:flex;flex-direction:column;justify-content:center;align-items:center;animation:scin .7s both}
.sc.out{animation:scout .6s both}
@keyframes scin{from{opacity:0;transform:translateX(8vw) scale(.96);filter:blur(10px)}}
@keyframes scout{to{opacity:0;transform:translateX(-8vw) scale(.96);filter:blur(10px)}}
.leave>*{animation:scout .5s both}
/* intro: waas en dender */
.p-intro{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;padding:3vw}
.p-i1{font-size:clamp(2.6rem,12vmin,9rem);color:var(--yel);text-shadow:5px 5px 0 var(--red),0 0 40px #ffd21f88;opacity:0;line-height:1}
.p-i1.on{opacity:1;animation:fogin 2.4s both}
@keyframes fogin{0%{opacity:0;filter:blur(40px);letter-spacing:.35em;transform:scale(1.2)}100%{opacity:1;filter:blur(0);letter-spacing:.04em;transform:none}}
.p-i2{font-size:clamp(2rem,9vmin,7rem);line-height:1.1;display:flex;gap:.3em;flex-wrap:wrap;justify-content:center;align-items:baseline}
.p-i2>span{opacity:0}
.p-i2>span.on{opacity:1}
.p-i2 .bij,.p-i2 .en{font-size:.6em;color:#dfe8ff}
.p-i2 .waas{color:#e8eeff;text-shadow:0 0 30px #aebcff,0 0 70px #7f94ff}
.p-i2 .dender{color:var(--yel);text-shadow:4px 4px 0 var(--red),0 0 40px #ffd21f}
.p-i2 .bij.on,.p-i2 .en.on{animation:pop .6s both}
.p-i2 .waas.on{animation:fogin 1.8s both}
.p-i2 .dender.on{animation:thud .7s both,glow2 .5s .7s 6 alternate}
@keyframes thud{0%{transform:translateY(-40vh) scale(3);opacity:0;filter:blur(8px)}60%{transform:none;opacity:1;filter:none}80%{transform:scale(.9)}100%{transform:none;opacity:1}}
@keyframes glow2{to{text-shadow:4px 4px 0 var(--red),0 0 90px #fff,0 0 140px #ffd21f}}
.p-i3{font-size:clamp(1.3rem,5vmin,3.4rem);opacity:0;margin-top:3vmin}
.p-i3.on{opacity:1;animation:pop .7s both,blink2 1.2s .8s infinite}
@keyframes blink2{50%{opacity:.35}}
.p-intro.gone{animation:introout .8s both}
@keyframes introout{to{opacity:0;transform:scale(.6) translateY(-30vh);filter:blur(12px)}}
.p-zap{position:fixed;inset:0;z-index:8;background:#fff;pointer-events:none;animation:zap .9s both}
@keyframes zap{0%{opacity:0}5%{opacity:.95}12%{opacity:.1}20%{opacity:.8}30%{opacity:0}45%{opacity:.4}60%,100%{opacity:0}}
.p-bolt{position:absolute;left:50%;top:0;height:70%;width:30vmin;margin-left:-15vmin;z-index:7;pointer-events:none;animation:boltf .9s both;filter:drop-shadow(0 0 12px #ffd21f) drop-shadow(0 0 30px #fff)}
@keyframes boltf{0%{opacity:1}10%{opacity:.2}25%{opacity:1}35%,100%{opacity:0}}
/* dia 1 */
.p-s1{width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;gap:3vw;align-items:center}
.p-stats{display:flex;flex-direction:column;gap:2.4vmin;align-items:center;transform:translateX(25vw);transition:transform 1.1s cubic-bezier(.6,0,.2,1)}
.p-s1.pie .p-stats{transform:none}
.p-stat{opacity:0;background:#ffffff12;border:.5vmin solid var(--yel);border-radius:2.2vmin;padding:2vmin 3vmin;min-width:min(34vw,520px);box-shadow:0 0 40px #ffd21f33}
.p-stat.on{opacity:1;animation:pop .7s both}
.p-stat .ic2{font-size:clamp(2rem,7vmin,5rem);line-height:1}
.p-stat .sn{font-size:clamp(3.4rem,15vmin,11rem);line-height:1;color:var(--yel);text-shadow:.7vmin .7vmin 0 var(--red)}
.p-stat .sl3{font-size:clamp(1.2rem,4.2vmin,3rem)}
.p-piebox{opacity:0;transform:scale(.5) rotate(-40deg);transition:all 1s cubic-bezier(.2,1.3,.4,1);display:flex;flex-direction:column;align-items:center;gap:2vmin}
.p-s1.pie .p-piebox{opacity:1;transform:none}
.p-piebox svg{width:min(40vw,52vmin);height:auto;overflow:visible}
.p-piebox text{font-family:Bangers,Impact,sans-serif;text-anchor:middle}
.p-piebox .pl{opacity:0;transition:opacity .5s;fill:#fff;stroke:#0a0c1c;stroke-width:3px;paint-order:stroke;font-size:18px}
.p-leg{display:grid;grid-template-columns:repeat(3,auto);gap:1vmin 2vw;justify-content:center;text-align:left}
.p-li{display:flex;align-items:center;gap:.8vmin;font-size:clamp(1rem,3vmin,2rem);opacity:0}
.p-li.on{opacity:1;animation:pop .5s both}
.p-li i{width:2.4vmin;height:2.4vmin;border-radius:50%;background:var(--c);flex:none}
.p-li b{font-family:Bangers,Impact,sans-serif;font-weight:400;color:var(--yel);letter-spacing:.04em}
@media (max-aspect-ratio:1/1){.p-s1{grid-template-columns:1fr;align-content:center}.p-stats{transform:none!important;flex-direction:row}.p-stat{min-width:0}.p-s2{grid-template-columns:1fr!important}}
/* dia 2: kaart */
.p-s2{width:100%;height:100%;display:grid;grid-template-columns:1.5fr 1fr;gap:2vw;align-items:center}
.p-s2.nomap{grid-template-columns:1fr}
.p-map{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;min-width:0}
.p-map svg{width:100%;height:100%;max-height:100%;overflow:hidden;border-radius:2vmin;background:#0d1230;border:.4vmin solid #ffffff22;opacity:0;transform:scale(.9);transition:all .9s}
.p-map svg.on{opacity:1;transform:none}
.ct{fill:#1c2455;stroke:#3a4688;stroke-width:.6;transition:fill .6s,opacity .8s}
.ct.hit{stroke:#fff;stroke-width:1}
.ct.tgt{fill:var(--red)!important;stroke:#fff}
.p-map.far .ct:not(.tgt){opacity:.35}
.p-map.far .bub{opacity:0!important}
.bub{opacity:0;transition:opacity .8s}
.bub.on{opacity:1}
.bi{transform:scale(0);transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
.bub.on .bi{transform:scale(1)}
.bub .bi circle{fill:#fff;stroke:#e8203a;stroke-width:3}
.bub text{font-family:Bangers,Impact,sans-serif;fill:#0a0c1c;text-anchor:middle}
.ld{stroke:#fff;stroke-width:1.5;fill:#fff}
.ping{fill:none;stroke:#e8203a;stroke-width:2.5;animation:pingf 1.7s ease-out infinite}
.ping.p2{animation-delay:.85s}
@keyframes pingf{from{transform:scale(1);opacity:.9}to{transform:scale(4.5);opacity:0}}
.snl{font:700 14px system-ui,sans-serif;fill:#fff;stroke:#0d1230;stroke-width:4px;paint-order:stroke;text-anchor:end}
.arc{fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;filter:drop-shadow(0 0 5px #ffd21f)}
.hero{filter:drop-shadow(0 0 6px #ffd21f)}
.p-side{display:flex;flex-direction:column;gap:1.4vmin;align-items:stretch;text-align:left;min-width:0}
.p-bars{display:flex;flex-direction:column;gap:1.4vmin}
.p-sh{font-size:clamp(1.6rem,5.2vmin,3.6rem);color:var(--yel);text-shadow:3px 3px 0 var(--red);margin-bottom:1vmin;text-align:center;line-height:1.05}
.p-bar{display:grid;grid-template-columns:minmax(0,30%) 1fr auto;gap:1.2vmin;align-items:center;opacity:0;transform:translateX(6vw);transition:all .6s cubic-bezier(.2,1.2,.4,1)}
.p-bar.on{opacity:1;transform:none}
.p-bar .bl{font-size:clamp(1.1rem,3.4vmin,2.4rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-bt{height:3.6vmin;background:#ffffff14;border-radius:99px;overflow:hidden}
.p-bt i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--yel),var(--red));transition:width 1.1s cubic-bezier(.2,.9,.3,1)}
.p-bar .bn{font-size:clamp(1.3rem,4vmin,2.8rem);color:var(--yel);min-width:2.2ch;text-align:right}
.p-more{font-size:clamp(.9rem,2.6vmin,1.6rem);opacity:.7;text-align:center}
.p-far{display:flex;flex-direction:column;gap:1.6vmin;align-items:center;text-align:center;animation:pop .8s both;background:#ffffff12;border:.5vmin solid var(--red);border-radius:2.2vmin;padding:3vmin;box-shadow:0 0 50px #e8203a55}
.p-far .fn{font-size:clamp(2rem,7.5vmin,5.5rem);line-height:1;text-shadow:0 0 18px var(--yel),4px 4px 0 var(--red);overflow-wrap:anywhere}
.p-far .fd{font-size:clamp(1.2rem,4vmin,2.8rem)}
.p-far .km{font-size:clamp(3rem,12vmin,9rem);color:var(--yel);text-shadow:.6vmin .6vmin 0 var(--red);line-height:1}
/* dia 3 */
.p-s3{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin;position:relative}
.p-sn{font-size:clamp(1.4rem,5vmin,3.6rem);opacity:0}
.p-sn.on{opacity:1;animation:pop .7s both}
.p-sn b{color:var(--yel);text-shadow:3px 3px 0 var(--red);font-weight:400}
.p-cards{display:grid;grid-template-columns:1fr 1fr;gap:3vw;width:100%;max-width:1500px}
.p-c2{opacity:0;background:#ffffff12;border:.5vmin solid var(--yel);border-radius:2.2vmin;padding:3vmin 2vmin;display:flex;flex-direction:column;gap:1.2vmin;align-items:center;min-width:0}
.p-c2.b{border-color:var(--blue)}
.p-c2.l.on{opacity:1;animation:inL .9s cubic-bezier(.2,1.2,.4,1) both}
.p-c2.r.on{opacity:1;animation:inR .9s cubic-bezier(.2,1.2,.4,1) both}
@keyframes inL{from{transform:translateX(-60vw) rotate(-6deg)}}@keyframes inR{from{transform:translateX(60vw) rotate(6deg)}}
.p-c2 .ci{font-size:clamp(3rem,11vmin,8rem);line-height:1}
.p-c2 .ck{font-size:clamp(1.3rem,4.4vmin,3rem);color:var(--yel)}
.p-c2 .cn{font-size:clamp(2rem,8vmin,6rem);line-height:1.05;text-shadow:0 0 18px var(--yel),4px 4px 0 var(--red);overflow-wrap:anywhere}
.p-c2 .cd{font-size:clamp(1.1rem,3.6vmin,2.6rem);opacity:.85}
.p-c2 .cdt{font-size:clamp(1.5rem,5vmin,3.6rem);color:var(--yel);background:#0006;border-radius:99px;padding:.4vmin 2.4vmin}
.p-road{position:absolute;left:-4vw;right:-4vw;bottom:-2vmin;height:7vmin;border-bottom:.6vmin dashed #ffffff55;overflow:hidden}
.p-bus{position:absolute;bottom:.4vmin;font-size:clamp(2.4rem,8vmin,6rem);left:0;animation:drive 7s linear infinite}
@keyframes drive{from{transform:translateX(-12vw)}to{transform:translateX(110vw)}}
/* outro */

function pdata(A, P) {
  P = P || {};

  const slots = v => 1 + (v.hasCo ? 1 : 0) + arr(v.moni).length + arr(v.bc).length;
  const cm = {};

    const raw = (v.land || '').trim(); if (!raw) return;
    const c = CT[norm(raw)], key = c ? c.nl : raw;
    (cm[key] = cm[key] || {nl: key, en: c && c.en, n: 0}).n++;
  });
  const byId = id => L.find(v => v.id === id);
  return {
    L, n: L.length, vol: L.reduce((a, v) => a + slots(v), 0),
    ages: AGES.map(a => ({a, n: L.filter(v => v.lf === a).length})),
    cs: Object.values(cm).sort((a, b) => b.n - a.n || a.nl.localeCompare(b.nl)),
    far: {v: byId(P.verste?.id), t: P.verste?.km || ''},
    first: {v: byId(P.eerste?.id), t: P.eerste?.txt || ''},
    last: {v: byId(P.laatste?.id), t: P.laatste?.txt || ''}

  root.classList.add('pres'); root.classList.remove('clear');

function confetti() {
  const c = document.createElement('canvas'); c.id = 'cf'; document.body.append(c);
  const x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const P = Array.from({length: 200}, () => ({x: Math.random() * c.width, y: -Math.random() * c.height, v: 2 + Math.random() * 4, s: 6 + Math.random() * 8, c: ['#ffd21f', '#e8203a', '#1e6bff', '#fff'][Math.random() * 4 | 0]}));
  (function f() {
    x.clearRect(0, 0, c.width, c.height);
    P.forEach(q => { q.y += q.v; x.fillStyle = q.c; x.fillRect(q.x, q.y, q.s, q.s * .6); });
    P.some(q => q.y < c.height) ? requestAnimationFrame(f) : c.remove();
  })();
}

const st = t => { const e = $('#sv'); if (e) e.textContent = t; };
const F = (i, k, lab, val, j, x) => `<label class="f"><span>${lab}</span><input type="text" data-i="${i}" data-k="${k}"${j !== undefined ? ` data-j="${j}"` : ''}${k === 'land' ? ' list="lnd"' : ''} value="${esc(val)}" placeholder="${['naam', 'b', 'd', 'land'].includes(k) ? '' : 'nog niet gevonden'}">${x ? `<button class="x" data-act="del" data-i="${i}" data-k="${k}" data-j="${j}" title="Plek verwijderen">✕</button>` : ''}</label>`;
const SEL = (i, v) => `<label class="f"><span>Leeftijd</span><select data-i="${i}" data-k="lf">${['', ...AGES].map(a => `<option value="${a}"${a === v.lf ? ' selected' : ''}>${a || 'kies…'}</option>`).join('')}</select></label>`;
const cnt = a => [a.filter(x => x.trim()).length, a.length];
const ch = (t, ok) => `<span class="ch ${ok ? 'ok' : 'no'}">${t}</span>`;
function hdr(v) {
  const [mf, mt] = cnt(v.moni), [bf, bt] = cnt(v.bc);
  return `${v._o ? '▾' : '▸'} <span class="tt">${esc(v.naam || '(nog geen naam)')} <small>· ${esc(v.b || '?')} · ${esc(v.d || '?')}</small></span>` +
    ch('VV', !!v.vv.trim()) + (v.hasCo ? ch('Co', !!v.co.trim()) : '') + (mt ? ch(`Moni ${mf}/${mt}`, mf === mt) : '') + (bt ? ch(`BC ${bf}/${bt}`, bf === bt) : '') +
    ch('Land', !!v.land.trim()) + ch('Lft', !!v.lf);
}
const people = v => [v.vv, v.hasCo ? v.co : '', ...v.moni, ...v.bc].filter(s => s.trim());
const full = v => norm([v.naam, v.b, v.d, v.land, ...people(v)].join(' '));

function ed() {
  const Q = norm(q.trim()); let shown = 0;
  $('#ed').innerHTML = vacs.map((v, i) => {
    const hide = Q && !full(v).includes(Q); if (!hide) shown++;
    return `<div class="vc"${hide ? ' style="display:none"' : ''}><div class="vh" id="h${i}" data-act="tg" data-i="${i}">${hdr(v)}</div>${v._o ? `<div class="vb">
      <div class="g">${F(i, 'naam', 'Vakantie', v.naam)}${F(i, 'b', 'Bestemming', v.b)}${F(i, 'land', 'Land', v.land)}${F(i, 'd', 'Datum', v.d)}${SEL(i, v)}</div>
      <div class="g">${F(i, 'vv', 'VV', v.vv)}<div class="f"><span><input type="checkbox" data-act="co" data-i="${i}" ${v.hasCo ? 'checked' : ''}> Co-VV</span>${v.hasCo ? `<input type="text" data-i="${i}" data-k="co" value="${esc(v.co)}" placeholder="nog niet gevonden" style="flex:1;min-width:0;padding:6px 8px;font-size:.95rem">` : '<i class="dim">geen co-vv</i>'}</div></div>
      <div class="g">${v.moni.map((n, j) => F(i, 'moni', 'Moni', n, j, true)).join('')}</div>
      <div class="g">${v.bc.map((n, j) => F(i, 'bc', 'BC', n, j, true)).join('')}</div>
      <div class="row" style="justify-content:flex-start"><button class="b sm" data-act="add" data-i="${i}" data-k="moni">+ moni</button><button class="b sm" data-act="add" data-i="${i}" data-k="bc">+ bc'er</button><button class="x" data-act="rm" data-i="${i}">🗑 vakantie verwijderen</button></div>
    </div>` : ''}</div>`;
  }).join('') || '<div class="dim">Nog geen vakanties. Klik op “Vakantie” of importeer een Excel.</div>';
  const tot = vacs.reduce((a, v) => a + people(v).length, 0);
  $('#cnt').textContent = `${vacs.length} vakanties · ${tot} namen · ${vacs.filter(v => !v.vv.trim()).length} zonder VV` + (Q ? ` · ${shown} gevonden` : '');
  optP();
}

function build() {
  const vak = {}, namen = {}, seen = {}; let dup = null;
  vacs.forEach(v => {
    const m = v.moni.map(s => s.trim()), b = v.bc.map(s => s.trim());
    vak[v.id] = {naam: v.naam.trim(), b: v.b.trim(), d: v.d.trim(), land: v.land.trim(), lf: v.lf || '', vv: v.vv.trim(), hasCo: !!v.hasCo, co: v.hasCo ? v.co.trim() : '', moni: m, bc: b};
    people(v).map(s => s.trim()).forEach(n => { const k = slug(n) || 'x' + n.length; if (seen[k]) dup = n; seen[k] = 1; namen[k] = n; });
  });
  return {vak, namen, dup};
}
async function save() {
  clearTimeout(saveT);
  const {vak, namen, dup} = build();
  if (dup) return st(`⚠️ “${dup}” staat dubbel. Voeg een achternaam toe. NIET opgeslagen.`);
  st('⏳ Opslaan…');
  try { await db.ref().update({vakanties: vak, namen}); dirty = false; st('✅ Opgeslagen om ' + new Date().toLocaleTimeString('nl-BE')); }
  catch (e) { st('❌ Niet opgeslagen: ' + e.message); }
}
const queue = () => { dirty = true; st('✏️ Wijzigingen worden opgeslagen…'); clearTimeout(saveT); saveT = setTimeout(save, 800); };
window.addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });

// Excel: kolommen Vakantie, Bestemming, Land, Leeftijd, Datum, VV, Co-VV, Aantal moni, Moni 1.., Aantal bc, BC 1..
async function importXlsx(file) {
  try { await lazy(SHEETJS, 'XLSX'); } catch (e) { return alert('Excel-bibliotheek kon niet laden. Controleer je internet.'); }
  const wb = XLSX.read(await file.arrayBuffer(), {type: 'array'});
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, defval: '', raw: false});
  const hd = (rows[0] || []).map(h => norm(String(h)).trim());
  const one = f => hd.findIndex(f), many = f => hd.map((h, i) => f(h) ? i : -1).filter(i => i >= 0);
  const C = {naam: one(h => h === 'vakantie' || h === 'naam' || h === 'naam vakantie'), b: one(h => h.startsWith('bestemming')), d: one(h => h.startsWith('datum')),
    land: one(h => h === 'land'), lf: one(h => h.startsWith('leeftijd')),
    vv: one(h => h === 'vv'), co: one(h => /^co[\s-]?vv$/.test(h)),
    nm: one(h => h.startsWith('aantal') && h.includes('moni')), nb: one(h => h.startsWith('aantal') && h.includes('bc')),
    m: many(h => /^moni\s*\d*$/.test(h)), bc: many(h => /^bc/.test(h) && !h.startsWith('aantal'))};
  if (C.naam < 0) return alert('Kolom “Vakantie” niet gevonden in de eerste rij. Gebruik het voorbeeldbestand als sjabloon.');
  const list = [];
  rows.slice(1).forEach(r => {
    const g = i => i >= 0 ? String(r[i] ?? '').trim() : '';
    if (!g(C.naam) && !g(C.b)) return;
    const slots = (idx, n) => { const a = idx.map(g).filter(Boolean); while (a.length < (parseInt(g(n)) || 0)) a.push(''); return a; };
    const co = g(C.co), noCo = C.co < 0 || ['nee', 'geen', '-', 'x'].includes(co.toLowerCase());
    list.push({...nv(), naam: g(C.naam), b: g(C.b), d: g(C.d), land: g(C.land), lf: normAge(g(C.lf)), vv: g(C.vv), hasCo: !noCo, co: noCo ? '' : co, moni: slots(C.m, C.nm), bc: slots(C.bc, C.nb)});
  });
  if (!list.length) return alert('Geen vakanties gevonden in het bestand.');
  if (!confirm(`${list.length} vakanties gevonden.\n\nOK = toevoegen aan de bestaande lijst.\nAnnuleren = niets doen.`)) return;
  vacs.push(...list); ed(); save();
}

/* ---- presentatie-instellingen (host) ---- */
const optP = () => ['pf', 'pe', 'pl'].forEach(id => {
  const s = $('#' + id); if (!s) return; const c = s.value;
  s.innerHTML = `<option value="">— kies vakantie —</option>` + vacs.map(v => `<option value="${esc(v.id)}">${esc(v.naam || '(naamloos)')} · ${esc(v.b || '?')}</option>`).join('');
  s.value = c; warnP();
});
const curPres = () => ({verste: {id: $('#pf').value, km: $('#pfk').value.trim()}, eerste: {id: $('#pe').value, txt: $('#pet').value.trim()}, laatste: {id: $('#pl').value, txt: $('#plt').value.trim()}});
const warnP = () => {
  const w = $('#pw'); if (!w) return; const p = curPres(), m = [];
  if (!p.verste.id) m.push('verste vakantie'); if (!p.eerste.id) m.push('eerste vertrek'); if (!p.laatste.id) m.push('laatste terugkomst');
  const nl = vacs.filter(v => !v.land.trim() || !v.lf).length;
  w.textContent = (m.length ? '⚠️ Nog in te vullen: ' + m.join(', ') + '. ' : '') + (nl ? `⚠️ ${nl} vakanties missen land of leeftijd.` : '');
};
function preview() {
  const o = document.createElement('div'); o.className = 'pv';
  const x = mk(`<button class="x pvx">✕ sluiten</button>`);
  document.body.append(o, x);
  let stop = () => {};
  const close = () => { stop(); o.remove(); x.remove(); document.removeEventListener('keydown', esc_); };
  const esc_ = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc_); x.onclick = close;
  stop = runPres(o, () => ({A: build().vak, P: curPres()}), 0, close);
}

function host(u) {
  if (!u) {
    V.innerHTML = `<h1 class="title h">HOST</h1><div class="card"><input id="em" type="email" placeholder="e-mail"><input id="pw" type="password" placeholder="wachtwoord"><button id="go">Inloggen</button></div>`;
    $('#go').onclick = () => auth.signInWithEmailAndPassword($('#em').value, $('#pw').value).catch(() => alert('Inloggen mislukt'));
    return;
  }
  V.style.justifyContent = 'flex-start';
  V.innerHTML = `<h1 class="title h" style="font-size:3rem">HOST</h1>
  <div class="card"><div class="big h">Status: <span id="st"></span></div></div>
  <div class="card"><div class="big h">Bediening</div>
    <div class="row"><button class="b" id="b0">🔦 Scherm donker</button><button class="b" id="b1">📱 Toon QR</button></div>
    <div class="row"><input id="sec" type="number" value="60" min="5" style="width:90px"> seconden <button id="b2">🚀 START COUNTDOWN</button></div>
    <div class="row"><input id="at" type="datetime-local"><button class="b" id="b3">⏰ Plan op uur</button></div>
    <p class="dim" style="margin:0">Reset = “Scherm donker”. Handig om te testen.<br>Staat de presentatie aan, dan loopt die eerst en daarna de countdown. Bij “Plan op uur” start de presentatie vanzelf zodat de countdown (het aantal seconden hierboven) precies op dat uur eindigt.</p></div>
  <div class="card w" id="pcard"><div class="big h">Presentatie</div>
    <label class="row" style="justify-content:flex-start;gap:10px"><input type="checkbox" id="pon" style="width:22px;height:22px"> <span>Toon de presentatie op het grote scherm vóór de countdown</span></label>
    <div class="g">
      <div class="f"><span>Verste</span><select id="pf"></select></div><div class="f"><span>Afstand</span><input type="text" id="pfk" placeholder="bv. 2150 km"></div>
      <div class="f"><span>Eerst weg</span><select id="pe"></select></div><div class="f"><span>Vertrek</span><input type="text" id="pet" placeholder="bv. za 3 juli, 7u30"></div>
      <div class="f"><span>Laatst terug</span><select id="pl"></select></div><div class="f"><span>Terug</span><input type="text" id="plt" placeholder="bv. za 24 juli, 18u"></div>
    </div>
    <div class="row" style="justify-content:flex-start"><button class="b sm" id="pv">👁 Voorbeeld op dit toestel</button></div>
    <div class="dim" id="pw"></div></div>
  <div class="card w"><div class="big h">Vakanties</div>
    <div class="row" style="justify-content:flex-start"><button id="add">➕ Vakantie</button><button class="b sm" id="imp">📥 Excel importeren</button><button class="b sm" id="tgl">⇕ Alles open/dicht</button><button class="b sm" id="now">💾 Opslaan</button><button class="b sm" id="pd">📄 PDF</button><button class="x" id="clr">🗑 Alles wissen</button></div>
    <input id="srch" type="search" placeholder="🔍 Zoek op vakantie, bestemming of naam…">
    <div id="cnt" class="dim"></div><div id="sv" class="dim">Laden…</div></div>
  <div id="ed" style="width:100%;max-width:780px;display:flex;flex-direction:column;gap:8px"></div>
  <input type="file" id="xl" accept=".xlsx,.xls,.csv" hidden>
  <datalist id="lnd">${COUNTRIES.map(c => `<option value="${esc(c[0])}">`).join('')}</datalist>`;
  // status bewaren zonder bestaande presentatie-instellingen (state/intro, state/pres) te wissen
  const upd = o => db.ref('state').update({qr: false, revealAt: null, introAt: null, ...o});
  $('#b0').onclick = () => upd({});
  $('#b1').onclick = () => upd({qr: true});
  $('#b2').onclick = () => {
    const sec = (+$('#sec').value || 60) * 1000, n = Math.round(now());
    if (S.intro) upd({qr: true, introAt: n, revealAt: n + PRES_MS + sec}); else upd({qr: true, revealAt: n + sec});
  };
  $('#b3').onclick = () => {
    const t = Date.parse($('#at').value); if (!t) return alert('Kies eerst een tijdstip');
    const sec = (+$('#sec').value || 60) * 1000, R_ = t + off, n = Math.round(now());
    if (S.intro) { const ia = Math.max(n, R_ - sec - PRES_MS); upd({qr: true, introAt: ia, revealAt: Math.max(R_, ia + PRES_MS + 5000)}); }
    else upd({qr: true, revealAt: R_});
  };
  // presentatie
  let pt = null;
  $('#pon').onchange = e => db.ref('state/intro').set(e.target.checked);
  $('#pcard').addEventListener('input', e => { if (e.target.id === 'pon') return; warnP(); clearTimeout(pt); pt = setTimeout(() => db.ref('state/pres').set(curPres()), 500); });
  $('#pcard').addEventListener('pointerdown', optP, true);
  $('#pv').onclick = preview;

  const E = $('#ed');
  $('#add').onclick = () => { const v = nv(); v._o = true; vacs.push(v); q = ''; $('#srch').value = ''; ed(); queue(); E.lastElementChild.scrollIntoView({block: 'center'}); E.lastElementChild.querySelector('input[type=text]').focus(); };
  $('#imp').onclick = () => $('#xl').click();
  $('#xl').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importXlsx(f); };
  $('#tgl').onclick = () => { const o = vacs.some(v => !v._o); vacs.forEach(v => v._o = o); ed(); };
  $('#clr').onclick = () => { if (vacs.length && confirm('ALLE vakanties wissen?') && confirm('Zeker? Dit kan je niet ongedaan maken.')) { vacs = []; ed(); save(); } };
  $('#now').onclick = save;
  $('#pd').onclick = async () => { await pdf(build().vak); };
  $('#srch').oninput = e => { q = e.target.value; ed(); };
  E.oninput = e => {
    const {i, k, j} = e.target.dataset; if (i == null || !k) return;
    j != null ? vacs[i][k][j] = e.target.value : vacs[i][k] = e.target.value;
    $('#h' + i).innerHTML = hdr(vacs[i]); queue();
  };
  E.onclick = e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const {act, i, k, j} = a.dataset;
    if (act === 'tg') { vacs[i]._o = !vacs[i]._o; ed(); return; }
    if (act === 'add') vacs[i][k].push('');
    else if (act === 'del') vacs[i][k].splice(j, 1);
    else if (act === 'co') vacs[i].hasCo = a.checked;
    else if (act === 'rm') { if (!confirm('Deze vakantie verwijderen?')) return; vacs.splice(i, 1); }
    ed(); queue();
    if (act === 'add') { const l = E.querySelectorAll(`[data-i="${i}"][data-k="${k}"]`); l[l.length - 1]?.focus(); }
  };
  db.ref('vakanties').get().then(async s => {
    vacs = Object.entries(s.val() || {}).map(([id, v]) => ({id, naam: v.naam || '', b: v.b || '', d: v.d || '', land: v.land || '', lf: v.lf || '', vv: v.vv || '', hasCo: !!v.hasCo, co: v.co || '', moni: arr(v.moni), bc: arr(v.bc), _o: false}));
    ed(); st('✅ Geladen'); cur = ''; tick();
    try {
      const o = (await db.ref('state').get()).val() || {}, p = o.pres || {};
      $('#pon').checked = !!o.intro;
      $('#pf').value = p.verste?.id || ''; $('#pfk').value = p.verste?.km || '';
      $('#pe').value = p.eerste?.id || ''; $('#pet').value = p.eerste?.txt || '';
      $('#pl').value = p.laatste?.id || ''; $('#plt').value = p.laatste?.txt || '';
      warnP();
    } catch (e) {}
  }).catch(e => st('❌ ' + e.message));
}
if (mode === 'host') auth.onAuthStateChanged(host);
</script></body></html>
